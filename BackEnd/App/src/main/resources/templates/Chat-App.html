<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Conversaciones Privadas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            height: 100vh;
            overflow: hidden;
            background: #f7f7f7;
        }

        /* LOGIN */
        #login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #005fff 0%, #0a66c2 100%);
        }

        .login-box {
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            min-width: 420px;
        }

        .login-box h1 {
            color: #005fff;
            margin-bottom: 35px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #2d3748;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #005fff;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #005fff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #0052cc;
        }

        .btn-login:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        /* CHAT LAYOUT */
        #chat-screen {
            display: none;
            height: 100vh;
        }

        .chat-layout {
            display: flex;
            height: 100vh;
            background: white;
        }

        /* SIDEBAR */
        .conversations-sidebar {
            width: 340px;
            background: #f9fafb;
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header h2 {
            font-size: 20px;
            color: #111827;
            font-weight: 700;
        }

        .btn-logout {
            background: #fee2e2;
            color: #dc2626;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
        }

        /* ✅ NUEVA SECCIÓN: Botón para abrir modal */
        .professionals-section {
            padding: 12px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .btn-new-chat {
            width: 100%;
            padding: 10px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-new-chat:hover {
            background: #059669;
        }

        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .conversation-item {
            padding: 14px;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .conversation-item:hover {
            background: #e5e7eb;
        }

        .conversation-item.active {
            background: #dbeafe;
        }

        .conversation-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
            flex-shrink: 0;
        }

        .conversation-info {
            flex: 1;
        }

        .conversation-name {
            font-weight: 600;
            color: #111827;
            font-size: 15px;
            margin-bottom: 2px;
        }

        .conversation-preview {
            color: #6b7280;
            font-size: 13px;
        }

        /* CHAT AREA */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
        }

        .chat-header h3 {
            font-size: 18px;
            color: #111827;
            font-weight: 600;
        }

        .message-list {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f9fafb;
        }

        .message-item {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .message-item.own {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: #6b7280;
            flex-shrink: 0;
        }

        .message-content {
            max-width: 60%;
        }

        .message-sender {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
        }

        .message-item:not(.own) .message-bubble {
            background: white;
            color: #111827;
            border: 1px solid #e5e7eb;
        }

        .message-item.own .message-bubble {
            background: #005fff;
            color: white;
        }

        .message-time {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
        }

        .message-input-container {
            padding: 16px 24px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .message-input-container input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 24px;
            font-size: 14px;
        }

        .message-input-container input:focus {
            outline: none;
            border-color: #005fff;
        }

        .btn-send {
            width: 44px;
            height: 44px;
            background: #005fff;
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .btn-send:hover {
            background: #0052cc;
        }

        .no-conversation-selected {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #9ca3af;
            font-size: 16px;
            gap: 12px;
        }

        /* ✅ MODAL DE PROFESIONALES */
        #professionalsModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: #111827;
            font-size: 22px;
        }

        .professional-card {
            padding: 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .professional-card:hover {
            border-color: #005fff;
            background: #f0f9ff;
        }

        .professional-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 18px;
        }

        .professional-info h3 {
            font-size: 16px;
            color: #111827;
            margin-bottom: 4px;
        }

        .professional-specialty {
            font-size: 13px;
            color: #6b7280;
        }

        .btn-cancel {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-cancel:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
    <div class="login-box">
        <h1>💬 Chat Profesional</h1>
        <div class="form-group">
            <label for="userId">ID de Usuario</label>
            <input type="text" id="userId" placeholder="Ingresa tu ID de usuario">
        </div>
        <button class="btn-login" onclick="login()" id="loginBtn">
            Iniciar Chat
        </button>
        <div class="error-message" id="errorMessage" style="color: #dc2626; margin-top: 12px; text-align: center; font-size: 14px;"></div>
    </div>
</div>

<!-- CHAT -->
<div id="chat-screen">
    <div class="chat-layout">
        <!-- SIDEBAR -->
        <div class="conversations-sidebar">
            <div class="sidebar-header">
                <h2>Mensajes</h2>
                <button class="btn-logout" onclick="logout()">Salir</button>
            </div>

            <!-- ✅ BOTÓN PARA NUEVA CONSULTA -->
            <div class="professionals-section">
                <button class="btn-new-chat" onclick="showProfessionals()">
                    <span>➕</span>
                    Nueva Consulta Profesional
                </button>
            </div>

            <div class="conversations-list" id="conversationsList">
                <!-- Conversaciones se cargan dinámicamente -->
            </div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-area">
            <div id="noChatSelected" class="no-conversation-selected">
                <div style="font-size: 48px;">💬</div>
                <div>Selecciona una conversación</div>
            </div>

            <div id="chatContainer" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header" id="chatHeader">
                    <!-- Header dinámico -->
                </div>

                <div class="message-list" id="messageList">
                    <!-- Mensajes dinámicos -->
                </div>

                <div class="message-input-container">
                    <input type="text" id="messageInput" placeholder="Escribe un mensaje..." onkeypress="if(event.key==='Enter') sendMessage()">
                    <button class="btn-send" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ✅ MODAL DE PROFESIONALES -->
<div id="professionalsModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Selecciona un Profesional</h2>
        </div>
        <div id="professionalsList">
            <!-- Profesionales se cargan dinámicamente -->
        </div>
        <button class="btn-cancel" onclick="closeProfessionalsModal()">Cancelar</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/stream-chat@8.40.2/dist/browser.full-bundle.min.js"></script>
<script>
    const API_BASE_URL = 'http://localhost:8081/api/v1/chat';
    const {StreamChat} = window;
    let chatClient;
    let currentChannel;
    let currentUserId;
    let professionals = [];

    async function login() {
        const userId = document.getElementById('userId').value.trim();
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        if (!userId) {
            errorMessage.textContent = 'Por favor ingresa tu ID de usuario';
            return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Conectando...';
        errorMessage.textContent = '';

        try {
            const response = await fetch(`${API_BASE_URL}/init?userId=${userId}`);
            const data = await response.json();

            chatClient = StreamChat.getInstance(data.apiKey);
            await chatClient.connectUser(
                { id: userId, name: `Usuario ${userId}` },
                data.token
            );

            currentUserId = userId;
            showChatScreen();
            await loadConversations();

            loginBtn.disabled = false;
            loginBtn.textContent = 'Iniciar Chat';

        } catch (error) {
            console.error('Error al conectar:', error);
            errorMessage.textContent = 'Error al conectar. Verifica tu ID';
            loginBtn.disabled = false;
            loginBtn.textContent = 'Iniciar Chat';
        }
    }

    function showChatScreen() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('chat-screen').style.display = 'block';
    }

    async function loadConversations() {
        try {
            const response = await fetch(`${API_BASE_URL}/user/${currentUserId}/conversations`);
            const conversations = await response.json();

            const list = document.getElementById('conversationsList');
            list.innerHTML = '';

            if (conversations.length === 0) {
                list.innerHTML = '<div style="padding: 20px; text-align: center; color: #9ca3af;">No tienes conversaciones</div>';
                return;
            }

            conversations.forEach(conv => {
                const div = document.createElement('div');
                div.className = 'conversation-item';
                div.onclick = () => openConversation(conv.channelType, conv.channelId);

                const initial = 'P';
                div.innerHTML = `
                    <div class="conversation-avatar">${initial}</div>
                    <div class="conversation-info">
                        <div class="conversation-name">Profesional</div>
                        <div class="conversation-preview">Última actividad</div>
                    </div>
                `;

                list.appendChild(div);
            });

        } catch (error) {
            console.error('Error al cargar conversaciones:', error);
        }
    }

    async function openConversation(channelType, channelId) {
        try {
            if (currentChannel) {
                await currentChannel.stopWatching();
            }

            currentChannel = chatClient.channel(channelType, channelId);
            await currentChannel.watch();

            document.getElementById('noChatSelected').style.display = 'none';
            document.getElementById('chatContainer').style.display = 'flex';

            const header = document.getElementById('chatHeader');
            header.innerHTML = `
                <div class="chat-avatar">P</div>
                <h3>Consulta Profesional</h3>
            `;

            await loadMessages();

            currentChannel.on('message.new', event => {
                addMessageToList(event.message);
            });

            document.querySelectorAll('.conversation-item').forEach(item => {
                item.classList.remove('active');
            });
            event.target.closest('.conversation-item')?.classList.add('active');

        } catch (error) {
            console.error('Error al abrir conversación:', error);
            alert('Error al cargar la conversación');
        }
    }

    async function loadMessages() {
        const messages = await currentChannel.query({ messages: { limit: 50 } });
        const list = document.getElementById('messageList');
        list.innerHTML = '';

        messages.messages.forEach(msg => addMessageToList(msg));
        list.scrollTop = list.scrollHeight;
    }

    function addMessageToList(message) {
        const list = document.getElementById('messageList');
        const isOwn = message.user.id === currentUserId;

        const div = document.createElement('div');
        div.className = `message-item ${isOwn ? 'own' : ''}`;

        const initial = message.user.name?.charAt(0).toUpperCase() || 'U';
        const time = new Date(message.created_at).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });

        div.innerHTML = `
            <div class="message-avatar">${initial}</div>
            <div class="message-content">
                <div class="message-sender">${message.user.name}</div>
                <div class="message-bubble">${message.text}</div>
                <div class="message-time">${time}</div>
            </div>
        `;

        list.appendChild(div);
        list.scrollTop = list.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();

        if (!text || !currentChannel) return;

        try {
            await currentChannel.sendMessage({ text });
            input.value = '';
        } catch (error) {
            console.error('Error al enviar mensaje:', error);
            alert('Error al enviar el mensaje');
        }
    }

    // ✅ FUNCIONES PARA MODAL DE PROFESIONALES
    async function showProfessionals() {
        try {
            const response = await fetch(`${API_BASE_URL}/professionals/available`);
            professionals = await response.json();

            const list = document.getElementById('professionalsList');
            list.innerHTML = '';

            professionals.forEach(prof => {
                const div = document.createElement('div');
                div.className = 'professional-card';
                div.onclick = () => startConversationWithProfessional(prof.id);

                const initial = prof.name.charAt(0).toUpperCase();

                div.innerHTML = `
                    <div class="professional-avatar">${initial}</div>
                    <div class="professional-info">
                        <h3>${prof.name}</h3>
                        <div class="professional-specialty">${prof.specialty}</div>
                    </div>
                `;

                list.appendChild(div);
            });

            document.getElementById('professionalsModal').style.display = 'flex';

        } catch (error) {
            console.error('Error al cargar profesionales:', error);
            alert('Error al cargar profesionales');
        }
    }

    async function startConversationWithProfessional(professionalId) {
        try {
            const response = await fetch(`${API_BASE_URL}/conversations/with-professional`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: currentUserId,
                    professionalId: professionalId
                })
            });

            const result = await response.json();

            closeProfessionalsModal();
            await loadConversations();
            await openConversation(result.channelType, result.channelId);

        } catch (error) {
            console.error('Error:', error);
            alert('Error al crear conversación');
        }
    }

    function closeProfessionalsModal() {
        document.getElementById('professionalsModal').style.display = 'none';
    }

    async function logout() {
        if (chatClient) await chatClient.disconnectUser();
        location.reload();
    }
</script>
</body>
</html>
